# The project's database. `npm run db:up` starts it, `npm run db:down` stops it.
#
# Postgres 17 to match production and the migrations that were written against
# it. Data lives in a named volume, so stopping the container keeps the rows and
# only `docker compose down -v` throws them away.
name: siriinvest

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: siriinvest
      # Local only, and never reachable off this machine — the port below is
      # bound to the loopback address rather than to every interface.
      POSTGRES_PASSWORD: siriinvest
      POSTGRES_DB: siriinvest_dev
    ports:
      # 5432 belongs to a Homebrew Postgres serving other projects and 5433 is
      # spoken for too, so this lands on 5434. Override with POSTGRES_PORT, and
      # change apps/api/.env to match.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the volume is first created.
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siriinvest -d siriinvest_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
